<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BigBang · Indicadores NFC</title>
  <link rel="stylesheet" href="/static/overlay.css?v={{v}}">
  <script defer src="/static/overlay.js?v={{v}}"></script>
</head>
<body>
  <!--
    Fondo transparente: se superpone a las pantallas de nfc.overlay_channels (config.json).
    El id de cada indicador debe coincidir con el alias de aliases.json.
  -->
  <div id="indicator-list">
    <div class="indicator" id="Superman"><img src="/static/img/superman.png?v={{v}}" alt="Superman"></div>
    <div class="indicator" id="Prince"><img src="/static/img/prince.png?v={{v}}" alt="Prince"></div>
    <div class="indicator" id="Jackson"><img src="/static/img/jackson.png?v={{v}}" alt="Jackson"></div>
    <div class="indicator" id="Beatles"><img src="/static/img/beatles.png?v={{v}}" alt="Beatles"></div>
  </div>
</body>
</html>
